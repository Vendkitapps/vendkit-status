name: Keep scheduled checks alive

# GitHub pauses scheduled workflows in repos with no commits for 60 days.
# This makes a tiny commit once a month so the uptime checker never stops.
on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .heartbeat
          git config user.name  "vendkit-status-bot"
          git config user.email "vendkit-status-bot@users.noreply.github.com"
          git add .heartbeat
          git commit -m "Monthly keepalive" && git push
